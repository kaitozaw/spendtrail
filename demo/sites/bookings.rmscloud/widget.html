<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RMS Cloud booking engine</title>
  <style>
    body { margin: 0; font: 13px/1.4 system-ui, sans-serif; color: #1e293b; }
    .box { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid #dbeafe; background: #eff6ff; border-radius: 10px; }
    .mark { width: 28px; height: 28px; border-radius: 6px; background: #1d4ed8; color: #fff; font-weight: 700; display: grid; place-items: center; font-size: 11px; }
    b { color: #1d4ed8; }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">RMS</div>
    <div><b>Availability confirmed</b> by RMS Cloud booking engine<br /><span style="color:#64748b">Your dates are held while you pay.</span></div>
  </div>
</body>
</html>
