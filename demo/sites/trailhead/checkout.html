<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta property="og:site_name" content="Trailhead Outfitters" />
  <title>Checkout – Trailhead Outfitters</title>
  <link rel="stylesheet" href="style.css" />
  <script src="http://pay.northpay.localhost/northpay.js" defer></script>
</head>
<body>
  <header>
    <img src="logo.svg" alt="Trailhead Outfitters logo" class="logo" />
    <span class="name">Trailhead Outfitters</span>
    <nav>Shop · Help · Account</nav>
  </header>
  <main>
    <h1>Checkout</h1>
    <p class="lede">Review your order and pay.</p>
    <div class="layout">
      <div class="card">
        <dl class="summary">
          <dt>Item</dt><dd>Trail Daypack 28L</dd>
          <dt>Total</dt><dd>$89.00</dd>
        </dl>
      </div>
      <form class="card" id="pay-form">
        <label>Name on card <input name="cc-name" autocomplete="cc-name" required /></label>
        <label>Card number <input name="cc-number" autocomplete="cc-number" inputmode="numeric" placeholder="4242 4242 4242 4242" required /></label>
        <div class="row">
          <label>Expiry <input name="cc-exp" autocomplete="cc-exp" placeholder="MM/YY" required /></label>
          <label>CVC <input name="cc-csc" autocomplete="cc-csc" inputmode="numeric" required /></label>
        </div>
        <button class="button" type="submit">Pay $89.00</button>
        <div data-northpay></div>
      </form>
    </div>
  </main>
  <script>
    // Demo only: no card data is sent anywhere.
    document.getElementById('pay-form').addEventListener('submit', (e) => {
      e.preventDefault();
      location.href = 'done.html';
    });
  </script>
  <footer>Trailhead Outfitters</footer>
</body>
</html>
